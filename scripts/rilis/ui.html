<style>

}

// ---------- Langkah 3: tugas dan URL ----------
function isianUrl(d, item, platform) {

  const masuk = h("input", { type: "url", placeholder: `URL ${P[platform]}`, "aria-label": `URL ${P[platform]} untuk ${item}` }); masuk.defaultValue = x?.url ?? "";
  let terkirim = x?.url ?? "";

  masuk.addEventListener("change", catat); masuk.addEventListener("blur", catat);

}
function halamanTugas(d) {

    h("div", { class: "tengah" }, h("div", { class: "label" }, cip(P[t.platform]), " ", t.label), t.tunggu ? h("div", { class: "warn kecil-teks" }, `Menunggu: ${t.tunggu}`) : null,
      t.catatUrl && !t.selesai ? h("div", { class: "urlbaris" }, isianUrl(d, t.item, t.platform)) : null),
    t.selesai ? null : h("div", { class: "baris" }, salin(t.salin), luar(t.tautan, "Buka ↗")));
  const tombol = (id, teks) => h("button", { class: saringan === id ? "aktif" : "", "aria-pressed": saringan === id, onclick: () => { saringan = id; tampil(); } }, teks);

    h("section", { class: "kartu" }, h("h2", {}, "URL tayang"), h("p", { class: "redup kecil-teks" }, "Tempel URL, lalu tekan Tab atau Enter. Tugas unggah tercentang sendiri."),
      h("div", { class: "gulir" }, h("table", {}, h("tr", {}, h("th", {}, "Konten"), Object.values(P).map((x) => h("th", {}, x))),
        d.rencana.items.map((i) => h("tr", {}, h("td", {}, i.nama, h("div", { class: "redup kecil-teks" }, waktu(i.jadwal))), Object.keys(P).map((p) => h("td", { class: "url" }, isianUrl(d, i.nama, p), cipStatus(p, d.items.find((x) => x.nama === i.nama).platform[p])))))))),
    h("div", { class: "pil" }, tombol("sekarang", `Bisa sekarang (${k.sekarang})`), tombol("tunggu", `Menunggu (${k.tunggu})`), tombol("selesai", `Selesai (${k.selesai})`), tombol("semua", `Semua (${k.total})`)),
    grup.length ? grup.map(([i, t]) => h("section", { class: "kartu" }, h("h2", {}, i.nama, " ", h("span", { class: "redup kecil-teks" }, waktu(i.jadwal))), t.map(baris))) : h("section", { class: "kartu redup" }, "Tidak ada tugas di saringan ini."),
  ];
}

// ---------- Rute ----------
async function tampil() {
  clearTimeout(pewaktu); const nomor = ++nomorTampil;
  const [t, s, langkahMinta] = location.hash.replace(/^#\/?/, "").split("/");
  try {
    const semua = await ambil("/api/ringkasan");
    pilih.replaceChildren(h("option", { value: "" }, "Buka siklus…"), ...semua.map((x) => h("option", { value: `${x.track}/${x.siklus}` }, `${x.track}-${x.nama}`)));
    pilih.value = t && s ? `${t}/${s}` : "";
    if (!t || !s) { if (nomor !== nomorTampil) return; isi.replaceChildren(...halamanPantau(semua, await ambil("/api/sistem")).filter(Boolean)); return jadwalkan(30000); }
    const d = await ambil(`/api/siklus?t=${encodeURIComponent(t)}&s=${encodeURIComponent(s)}`);
    if (nomor !== nomorTampil) return;
    if (!d.rencana) { isi.replaceChildren(h("h1", {}, `${d.track}-${d.nama}`), h("section", { class: "kartu" }, h("p", {}, `Belum ada rencana rilis. Rencana disusun dari naskah dan hasil render${d.panduan ? ", teksnya diambil dari hasil produksi" : ""}. Belum ada yang dikirim.`), h("button", { class: "utama", onclick: () => aksi(d, { aksi: "plan" }) }, "Buat rencana"))); return; }
    const langkah = ["isi", "kirim", "tugas"].includes(langkahMinta) ? langkahMinta : d.rencana.kunci_manual ? "tugas" : "isi";
    const gulir = scrollY, dulu = isi.dataset.halaman, kini = `${t}/${s}/${langkah}`; isi.dataset.halaman = kini;
    // Gambar ulang di halaman yang sama tidak boleh membuang fokus atau ketikan yang belum dikirim.
    const f = dulu === kini && isi.contains(document.activeElement) ? document.activeElement : null; const label = f?.getAttribute("aria-label"), ketikan = f && f.type !== "checkbox" && f.value !== f.defaultValue ? f.value : null;
    const sis = langkah === "kirim" ? await ambil("/api/sistem") : null;
    if (nomor !== nomorTampil) return;
    const badan = { isi: halamanIsi, kirim: halamanKirim, tugas: halamanTugas }[langkah](d, sis);
    isi.replaceChildren(kepala(d, langkah), ...[badan].flat(Infinity).filter(Boolean));
    scrollTo(0, dulu === kini ? gulir : 0);

  } catch (e) { galat(e.message); }
}
/** Segarkan berkala; ditunda selama pengguna sedang mengetik. */
function jadwalkan(ms) {
  clearTimeout(pewaktu);
  pewaktu = setTimeout(() => (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) && document.activeElement.type !== "checkbox" ? jadwalkan(ms) : tampil()), ms);
}

pilih.addEventListener("change", () => (location.hash = pilih.value ? `#/${pilih.value}` : "#/"));
addEventListener("hashchange", () => { bersih(); $("simpanan").textContent = ""; antre.then(tampil); });
addEventListener("beforeunload", (e) => { if (tertunda || $("simpanan").textContent === "Ada perubahan…") e.preventDefault(); });
tampil();
